{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Management</title>
  <style>
    :root {
      --bg: #f5f2ee;
      --panel: #fffdfb;
      --ink: #1d1b18;
      --muted: #675f59;
      --line: #e7dfd7;
      --accent: #1c1c1a;
      --danger: #b64b49;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .brand-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      padding: 8px 12px;
      font-size: 0.86rem;
      color: var(--muted);
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.65);
    }
    nav a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      margin-top: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.7rem);
      letter-spacing: -0.04em;
    }
    .key-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      border-radius: 10px;
      font: inherit;
    }
    input {
      min-width: 220px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: #fff;
    }
    button {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .menu-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .menu-item strong {
      display: block;
      margin-bottom: 4px;
    }
    .menu-item span {
      color: var(--muted);
      font-size: 0.84rem;
    }
    .status {
      min-height: 22px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status.error { color: var(--danger); }
    form {
      display: grid;
      gap: 12px;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .inline { grid-template-columns: 1fr; }
      .key-box { width: 100%; }
      .key-box input { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand"><span class="brand-mark"></span> Local Studio</div>
      <nav>
        <a href="/restaurant/staff/">Dashboard</a>
        <a href="/restaurant/staff/menu/" class="active">Menu</a>
        <a href="/restaurant/staff/settings/">Settings</a>
        <a href="/restaurant/order/">Order</a>
      </nav>
    </div>

    <div class="layout">
      <section class="card">
        <div class="topbar" style="margin: 0 0 12px;">
          <h1>Menu Management</h1>
          <form id="staff-key-form" class="key-box">
            <input id="staff-key" type="password" placeholder="Staff key" aria-label="Staff key">
            <button type="submit">Load</button>
          </form>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="menu-list" class="menu-list"></div>
      </section>

      <aside class="card">
        <h2>Add item</h2>
        <form id="menu-form">
          <input id="name" type="text" placeholder="Name" required>
          <input id="category" type="text" placeholder="Category" required>
          <input id="barcode" type="text" placeholder="Barcode or QR value (optional)">
          <textarea id="description" placeholder="Description"></textarea>
          <div class="inline">
            <input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
            <label class="checkbox"><input id="is-available" type="checkbox" checked> Available</label>
          </div>
          <button type="submit">Save item</button>
        </form>
      </aside>
    </div>
  </div>

  <script src="{% static 'restaurant/staff-menu.js' %}" defer></script>
</body>
</html>
