{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place Order</title>
  <style>
    :root {
      --bg: #f5f2ee;
      --panel: #fffdfb;
      --ink: #1d1b18;
      --muted: #675f59;
      --line: #e7dfd7;
      --accent: #1c1c1a;
      --good: #2e7a5f;
      --danger: #b64b49;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .brand-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav a {
      padding: 8px 12px;
      font-size: 0.86rem;
      color: var(--muted);
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.65);
    }
    nav a.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 18px;
      margin-top: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.04em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }
    .key-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input, button {
      border-radius: 10px;
      font: inherit;
    }
    input {
      min-width: 220px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: #fff;
    }
    button {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .menu-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .menu-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 14px;
      align-items: center;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .menu-item h3 {
      margin: 0 0 6px;
      font-size: 1.06rem;
    }
    .menu-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .price {
      font-weight: 700;
    }
    .customer-form {
      display: grid;
      gap: 10px;
      margin: 14px 0 18px;
    }
    .order-prompt {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }
    .order-prompt textarea {
      min-height: 82px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }
    .basket-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
      display: grid;
      gap: 12px;
    }
    .basket-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .totals {
      display: grid;
      gap: 8px;
      margin: 12px 0 18px;
    }
    .total-line {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }
    .total-line strong {
      color: var(--ink);
    }
    .status {
      min-height: 22px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status.error { color: var(--danger); }
    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
      .menu-item { grid-template-columns: 1fr auto; }
      .price { grid-column: 2; }
      .key-box { width: 100%; }
      .key-box input { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand"><span class="brand-mark"></span> Local Studio</div>
      <nav>
        <a href="/order/" class="active">Order</a>
        <a href="/staff/">Dashboard</a>
        <a href="/staff/menu/">Menu</a>
        <a href="/staff/settings/">Settings</a>
      </nav>
    </div>

    <div class="layout">
      <section class="card">
        <div class="topbar" style="margin-bottom: 0;">
          <div>
            <h1>Place Order</h1>
            <p class="subtitle">Choose a few items and send the order.</p>
          </div>
          <form id="api-key-form" class="key-box">
            <input id="api-key" type="password" placeholder="Workspace API key" aria-label="Workspace API key">
            <button type="submit">Connect</button>
          </form>
        </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="layout">
      <section class="menu-card">
        <h2>Menu</h2>
        <div id="menu-list" class="menu-list"></div>
      </section>

      <aside class="basket-card">
        <h2>Order</h2>
        <div class="customer-form">
          <input id="customer-name" type="text" placeholder="Customer name" aria-label="Customer name">
        </div>
        <form id="natural-order-form" class="order-prompt">
          <label for="order-prompt-text">Describe your order</label>
          <textarea id="order-prompt-text" maxlength="2000" required placeholder="Two burgers, one lemon tea, no onions on one burger"></textarea>
          <button id="draft-order-button" type="submit">Draft order with selected AI</button>
        </form>
        <ul id="basket-list" class="basket-list"></ul>
        <div class="totals">
          <div class="total-line"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <div class="total-line"><span>Discount</span><strong id="discount">$0.00</strong></div>
          <div class="total-line"><span>Tax</span><strong id="tax">$0.00</strong></div>
          <div class="total-line"><span>Total</span><strong id="total">$0.00</strong></div>
        </div>
        <button id="submit-order" type="button">Submit Order</button>
      </aside>
    </div>
  </div>

  <script src="{% static 'api/customer-order.js' %}" defer></script>
</body>
</html>
